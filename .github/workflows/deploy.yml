name: Deploy

# 触发方式：
#   1. push 到主分支自动部署
#   2. 手动触发：Actions 页 → Deploy → Run workflow（可选任意分支）
#
# GitHub Pages 由仓库设置里的「分支自动部署」负责，本 workflow 只管 CloudBase 静态托管。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一引用上排队执行，避免并发部署互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudbase-hosting:
    name: Deploy to CloudBase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只打包需要公开发布的文件，避免把源码/工具文件传到线上。
      # 新增页面时必须在此登记，否则不会上线。
      - name: Assemble dist
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets

          PAGES="index.html dividend.html investmentManagement.html itemManagement.html ledgerWorkbench.html personalFinancesDashboard.html sunlightCompass.html"
          for f in $PAGES; do
            [ -f "$f" ] || { echo "::error::缺少页面文件 $f"; exit 1; }
            cp "$f" dist/
          done

          for f in assets/cloudbase-sdk.js assets/cloudbase-sync.js; do
            [ -f "$f" ] || { echo "::error::缺少脚本文件 $f"; exit 1; }
            cp "$f" dist/assets/
          done

          echo "=== 本次部署清单 ==="
          find dist -type f | sort
          echo "文件数: $(find dist -type f | wc -l)"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@3.8.1

      # 凭证通过环境变量注入，不直接出现在命令行里。
      # 注意：--apiKeyId / --apiKey 接收的是【腾讯云 CAM 密钥】（访问管理 → API 密钥管理），
      # 不是 CloudBase 控制台的 API Key —— 后者 api_key 类型平台尚未开放，传入会报
      # "Tencent Cloud Key verification failed"。
      # 先确认 Secret 真的传进来了。未配置时 ${{ secrets.X }} 会展开成空字符串，
      # 导致 CLI 拿着空值去校验，报的却是"密钥错误"，极难定位。
      - name: Verify secret
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDBASE_API_KEY:-}" ]; then
            echo "::error::CLOUDBASE_API_KEY 未设置或为空"
            echo "请到 Settings → Secrets and variables → Actions 检查名称是否完全一致（区分大小写）"
            exit 1
          fi
          echo "长度: ${#CLOUDBASE_API_KEY}"
          case "$CLOUDBASE_API_KEY" in
            eyJ*) echo "格式正确（JWT）" ;;
            *) echo "::warning::不以 eyJ 开头，请确认填的是 CloudBase 环境级 API Key" ;;
          esac

      # 用 CloudBase 环境级 API Key 登录：
      #   权限被限定在本环境内，比账号级 CAM 密钥安全得多，且只需 1 个 Secret。
      # 注意参数必须是 --cloudbase-api-key，不是 --apiKeyId/--apiKey（那组是给 CAM 密钥用的）。
      - name: Login to CloudBase
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e mycloudbase-d2g3grx15f32df45e

      # --verify 校验远端与本地一致（大小+MD5）
      # --safe   失败自动回滚到备份
      # --prune  清理远端不属于本次发布的文件，保证云端与仓库完全对齐
      - name: Deploy
        run: tcb hosting deploy dist -e mycloudbase-d2g3grx15f32df45e --verify --safe --prune --yes

      # 云函数：场外基金净值代理（CORS 由云端完成，供智投精算看板调用）。
      # 失败不阻断静态站点发布；需与 functions/fundNavProxy 目录保持一致。
      - name: Deploy Cloud Function (fundNavProxy)
        env:
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -d "functions/fundNavProxy" ]; then
            tcb fn deploy fundNavProxy -e mycloudbase-d2g3grx15f32df45e --yes \
              || echo "::warning::云函数 fundNavProxy 部署失败，不影响静态站点（可本地用 deploy.ps1 重试）"
          else
            echo "::warning::未找到 functions/fundNavProxy，跳过云函数部署"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## 部署结果 ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}"
            echo ""
            echo "- 环境：\`mycloudbase\`"
            echo "- Commit：\`${GITHUB_SHA::7}\`"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- 站点：https://mycloudbase-d2g3grx15f32df45e-1300750191.tcloudbaseapp.com/"
          } >> "$GITHUB_STEP_SUMMARY"
