<style>

<script>
const LAT = 23.1291;
const LON = 113.2644;
const SVG_NS = 'http://www.w3.org/2000/svg';

const solarTerms = [
  { name: '小寒', month: 1, day: 5 }, { name: '大寒', month: 1, day: 20 },
  { name: '立春', month: 2, day: 4 }, { name: '雨水', month: 2, day: 19 },
  { name: '惊蛰', month: 3, day: 6 }, { name: '春分', month: 3, day: 21 },
  { name: '清明', month: 4, day: 5 }, { name: '谷雨', month: 4, day: 20 },
  { name: '立夏', month: 5, day: 6 }, { name: '小满', month: 5, day: 21 },
  { name: '芒种', month: 6, day: 6 }, { name: '夏至', month: 6, day: 21 },
  { name: '小暑', month: 7, day: 7 }, { name: '大暑', month: 7, day: 23 },
  { name: '立秋', month: 8, day: 8 }, { name: '处暑', month: 8, day: 23 },
  { name: '白露', month: 9, day: 8 }, { name: '秋分', month: 9, day: 23 },
  { name: '寒露', month: 10, day: 8 }, { name: '霜降', month: 10, day: 23 },
  { name: '立冬', month: 11, day: 7 }, { name: '小雪', month: 11, day: 22 },
  { name: '大雪', month: 12, day: 7 }, { name: '冬至', month: 12, day: 22 }
];

const months = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

let animationId = null;
let animating = false;

function d2r(d) { return d * Math.PI / 180; }
function r2d(r) { return r * 180 / Math.PI; }

function dayOfYear(month, day) {
  const days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let doy = 0;
  for (let i = 0; i < month - 1; i++) doy += days[i];
  return doy + day;
}

function getSolarParams(doy) {
  const n = doy;
  const Jstar = n + (0 - 120 + 0) / 360;
  const M = d2r(357.5291 + 0.98560028 * Jstar);
  const C = d2r((1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)));
  const lambda = M + C + d2r(180 + 102.9372);
  const delta = Math.asin(Math.sin(lambda) * Math.sin(d2r(23.44)));
  return { M, C, lambda, delta };
}

function getDeclination(doy) {
  return getSolarParams(doy).delta;
}

function getEquationOfTime(doy) {
  const params = getSolarParams(doy);
  const y = Math.tan(d2r(23.44) / 2) ** 2;
  const L = params.lambda;
  const eot = r2d(y * Math.sin(2 * L) - 2 * 0.0167 * Math.sin(params.M) + 
               4 * 0.0167 * y * Math.cos(params.M) * Math.cos(2 * L) - 
               0.5 * y * y * Math.sin(4 * L) - 
               1.25 * 0.0167 ** 2 * Math.sin(2 * params.M));
  return eot * 4;
}

function calcSunTimes(doy) {
  const params = getSolarParams(doy);
  const delta = params.delta;
  const eot = getEquationOfTime(doy);
  
  const Jtransit = 12 - (LON - 120) / 15 - eot / 60;
  
  const latRad = d2r(LAT);
  
  const sunRiseSetAngle = -d2r(0.83);
  
  const cosH = (Math.sin(sunRiseSetAngle) - Math.sin(latRad) * Math.sin(delta)) / 
                (Math.cos(latRad) * Math.cos(delta));
  
  if (cosH > 1) {
    return { sunrise: null, sunset: null, dayLength: 0, isPolarNight: true };
  }
  if (cosH < -1) {
    return { sunrise: 0, sunset: 24, dayLength: 24, isPolarDay: true };
  }
  
  const Hdeg = r2d(Math.acos(cosH));
  
  const Jset = Jtransit + Hdeg / 15;
  const Jrise = Jtransit - Hdeg / 15;
  
  const sunrise = ((Jrise % 24) + 24) % 24;
  const sunset = ((Jset % 24) + 24) % 24;
  const dayLength = sunset - sunrise;
  
  return { sunrise, sunset, dayLength };
}

function formatTime(hours) {
  if (hours === null || hours === undefined) return '极夜';
  if (hours === 0) return '00:00';
  if (hours === 24) return '24:00';
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function getGoldenWindows(sunData) {
  if (sunData.dayLength < 0.5) return null;
  
  const morningEnd = Math.min(sunData.sunrise + 1, sunData.sunset);
  const eveningStart = Math.max(sunData.sunset - 1, sunData.sunrise);
  
  return {
    morning: { start: sunData.sunrise, end: morningEnd },
    evening: { start: eveningStart, end: sunData.sunset }
  };
}

function calcSolarElevation(doy, hour) {
  const eqTime = getEquationOfTime(doy);
  const solarTime = hour + (eqTime / 60) + (LON - 120) / 15;
  const hourAngle = d2r(15 * (solarTime - 12));
  const decl = getDeclination(doy);
  const latRad = d2r(LAT);
  const sinAlt = Math.sin(latRad) * Math.sin(decl) + 
                 Math.cos(latRad) * Math.cos(decl) * Math.cos(hourAngle);
  return r2d(Math.asin(sinAlt));
}

function getSeason(doy) {
  const springEquinox = dayOfYear(3, 20);
  const summerSolstice = dayOfYear(6, 21);
  const autumnEquinox = dayOfYear(9, 22);
  const winterSolstice = dayOfYear(12, 22);
  
  if (doy >= springEquinox && doy < summerSolstice) return { name: '春季', color: '#66bb6a' };
  if (doy >= summerSolstice && doy < autumnEquinox) return { name: '夏季', color: '#ff7043' };
  if (doy >= autumnEquinox && doy < winterSolstice) return { name: '秋季', color: '#ffa726' };
  return { name: '冬季', color: '#5c6bc0' };
}

function getSolarTerm(doy) {
  let nearest = null;
  let minDiff = Infinity;
  
  for (const term of solarTerms) {
    const termDoy = dayOfYear(term.month, term.day);
    const diff = Math.abs(termDoy - doy);
    if (diff < minDiff) {
      minDiff = diff;
      nearest = term;
    }
  }
  
  if (minDiff <= 3) {
    return `${nearest.name}${minDiff === 0 ? '（今日）' : ''}`;
  }
  
  let nextTerm = null;
  for (const term of solarTerms) {
    const termDoy = dayOfYear(term.month, term.day);
    if (termDoy >= doy) {
      nextTerm = term;
      break;
    }
  }
  if (!nextTerm) nextTerm = solarTerms[0];
  
  return `临近${nextTerm.name}`;
}

function doyToDate(doy) {
  const days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let m = 0;
  let remaining = doy;
  while (remaining > days[m]) {
    remaining -= days[m];
    m++;
  }
  return { month: m + 1, day: remaining };
}

function getWeekday(doy) {
  const base = new Date(2024, 0, 1);
  base.setDate(base.getDate() + doy - 1);
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  return `星期${weekdays[base.getDay()]}`;
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = d2r(angleDeg - 90);
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function arcPath(cx, cy, rStart, rEnd, angleStart, angleEnd) {
  const p1 = polarToCartesian(cx, cy, rEnd, angleStart);
  const p2 = polarToCartesian(cx, cy, rEnd, angleEnd);
  const p3 = polarToCartesian(cx, cy, rStart, angleEnd);
  const p4 = polarToCartesian(cx, cy, rStart, angleStart);
  const largeArc = angleEnd - angleStart > 180 ? 1 : 0;
  
  return [
    `M ${p1.x} ${p1.y}`,
    `A ${rEnd} ${rEnd} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
    `L ${p3.x} ${p3.y}`,
    `A ${rStart} ${rStart} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
    'Z'
  ].join(' ');
}

    else if (noonElev > 60) uv = 9;
    else if (noonElev > 50) uv = 8;
    else if (noonElev > 40) uv = 7;
    else if (noonElev > 30) uv = 6;
    else if (noonElev > 20) uv = 5;
    else if (noonElev > 10) uv = 3;
    else if (noonElev > 0) uv = 1;
    else uv = 0;
    return { value: uv, elev: noonElev };
  }
  
  function getUVAdvice(uv) {
    if (uv >= 11) return { text: `${uv}+ 极高`, color: '#d32f2f', note: '避免户外活动' };
    if (uv >= 8) return { text: `${uv} 很高`, color: '#f57c00', note: '需严密防护' };

    return { text: `0 极低`, color: '#81c784', note: '无需防护' };
  }
  
  const uv = getUVLevel(doy);
  const uvAdvice = getUVAdvice(uv.value);

    if (!goldenWindows) return { morning: '极夜', evening: '极夜' };
    
    const mStartStr = formatTime(goldenWindows.morning.start);

  const bestSunInfo = getBestSunTime(sunData);

  document.getElementById('nightLength').textContent = 
    `${Math.floor(24 - sunData.dayLength)}时${Math.round((24 - sunData.dayLength) % 1 * 60)}分`;
  document.getElementById('diffSolstice').textContent = 
    `${diff >= 0 ? '+' : ''}${diff.toFixed(1)} 小时`;
  document.getElementById('morningGolden').textContent = bestSunInfo.morning;
  document.getElementById('eveningGolden').textContent = bestSunInfo.evening;
  document.getElementById('uvLevel').textContent = uvAdvice.text;
  document.getElementById('uvLevel').style.color = uvAdvice.color;
  document.getElementById('uvLevel').title = `正午太阳高度角 ${uv.elev.toFixed(0)}° · ${uvAdvice.note}`;
  
  document.getElementById('daySlider').value = doy;
  
  updateWeatherForDoy(doy);
}

let currentWeather = null;
let forecastDoyStart = null;

function getForecastStartDoy() {
  const now = new Date();
  return dayOfYear(now.getMonth() + 1, now.getDate());
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=7&timezone=auto`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Weather API error');
    const data = await resp.json();
    currentWeather = data;
    forecastDoyStart = getForecastStartDoy();
    updateWeatherUI();
    renderForecast();
    const currentDoy = parseInt(document.getElementById('daySlider').value);
    updateWeatherForDoy(currentDoy);
  } catch (err) {
    const desc = document.getElementById('weatherDesc');
    const detail = document.getElementById('weatherDetail');
    desc.textContent = '天气获取失败';
    detail.textContent = '请检查网络连接';
    detail.className = 'weather-detail';
    const card = document.getElementById('weatherCard');
    card.className = 'weather-card unavailable';
  }
}

function evaluateSunbathing(sunData, weatherCode, doy) {
  const weather = interpretWeather(weatherCode);
  const windows = getGoldenWindows(sunData);
  
  if (!windows) {
    return {
      overall: 'bad',
      morning: { status: 'bad', label: '极夜', elev: 0 },
      evening: { status: 'bad', label: '极夜', elev: 0 }
    };
  }
  
  function assessWindow(window) {
    const midHour = (window.start + window.end) / 2;
    const elev = calcSolarElevation(doy, midHour);
    
    if (!weather.canSunbathe) {
      return { status: 'bad', label: '下雨', elev };
    }
    
    if (weather.type === 'cloudy') {
      if (elev < 5) return { status: 'bad', label: '云厚光弱', elev };
      if (elev < 15) return { status: 'mid', label: '有限', elev };
      return { status: 'mid', label: '可用', elev };
    }
    
    if (elev < 3) return { status: 'bad', label: '光度不足', elev };
    if (elev < 10) return { status: 'mid', label: '较弱', elev };
    return { status: 'good', label: '充足', elev };
  }
  
  const m = assessWindow(windows.morning);
  const e = assessWindow(windows.evening);
  
  let overall;
  if (m.status === 'good' && e.status === 'good') overall = 'good';
  else if (m.status === 'good' || e.status === 'good') overall = 'good';
  else if (m.status === 'mid' || e.status === 'mid') overall = 'mid';
  else overall = 'bad';
  
  return { overall, morning: m, evening: e };
}

function getWeatherForDoy(doy) {
  if (!currentWeather || !forecastDoyStart) return null;
  const offset = doy - forecastDoyStart;
  if (offset < 0 || offset > 6) return null;
  const daily = currentWeather.daily;
  return {
    weather_code: daily.weather_code[offset],
    temp_max: daily.temperature_2m_max[offset],
    temp_min: daily.temperature_2m_min[offset],
    precipitation: daily.precipitation_sum[offset],
    date: daily.time[offset]
  };
}

function updateWeatherUI() {
  if (!currentWeather) return;
  
  const current = currentWeather.current;
  const daily = currentWeather.daily;
  const info = interpretWeather(current.weather_code);
  
  const card = document.getElementById('weatherCard');
  card.className = 'weather-card ' + info.type;
  
  document.getElementById('weatherIcon').textContent = info.icon;
  document.getElementById('weatherTemp').textContent = `${Math.round(current.temperature_2m)}°C`;
  document.getElementById('weatherDesc').textContent = info.desc;
  
  const humidity = current.relative_humidity_2m;
  const wind = Math.round(current.wind_speed_10m);
  const precip = daily && daily.precipitation_sum ? daily.precipitation_sum[0] : 0;
  
  let detailHtml = `湿度 ${humidity}% · 风速 ${wind} km/h`;
  if (precip > 0) {
    detailHtml += ` · 今日降水 ${precip}mm`;
  }
  
  if (!info.canSunbathe) {
    detailHtml += '<div class="weather-warning">⛔ 今日不可日晒</div>';
  } else if (info.type === 'cloudy') {
    detailHtml += '<div class="weather-ok">☀️ 云层较厚，日晒有限</div>';
  } else {
    detailHtml += '<div class="weather-ok">✅ 适合晒太阳</div>';
  }
  
  document.getElementById('weatherDetail').innerHTML = detailHtml;
}

function renderForecast() {
  const container = document.getElementById('forecastDays');
  const rangeLabel = document.getElementById('forecastRange');
  
  if (!currentWeather || !forecastDoyStart) {
    rangeLabel.textContent = '';
    container.innerHTML = '<div class="forecast-day unavailable"><div class="forecast-day-name">加载中</div><div class="forecast-day-date">—</div><span class="forecast-day-icon">—</span><div class="forecast-day-temp">—</div><div class="forecast-day-sun">—</div></div>';
    return;
  }
  
  const daily = currentWeather.daily;
  const todayDoy = forecastDoyStart;
  const selectedDoy = parseInt(document.getElementById('daySlider').value);
  
  const today = new Date();
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  
  const startDate = new Date(today);
  const endDate = new Date(today);
  endDate.setDate(endDate.getDate() + 6);
  rangeLabel.textContent = `${startDate.getMonth() + 1}/${startDate.getDate()} - ${endDate.getMonth() + 1}/${endDate.getDate()}`;
  
  container.innerHTML = '';
  
  for (let i = 0; i < 7; i++) {
    const doy = todayDoy + i;
    const date = new Date(today);
    date.setDate(date.getDate() + i);
    
    const dayDiv = document.createElement('div');
    dayDiv.className = 'forecast-day';
    
    const isSelected = (doy === selectedDoy);
    if (isSelected) dayDiv.classList.add('selected');
    
    const wCode = daily.weather_code[i];
    const info = interpretWeather(wCode);
    const tempMax = Math.round(daily.temperature_2m_max[i]);
    
    const sunData = calcSunTimes(doy);
    const evalResult = evaluateSunbathing(sunData, wCode, doy);
    
    const overallIcon = evalResult.overall === 'good' ? '✅' :
                        evalResult.overall === 'mid' ? '☀️' : '⛔';
    const overallLabel = evalResult.overall === 'good' ? '适合' :
                         evalResult.overall === 'mid' ? '有限' : '不可';
    const overallClass = 'sun-' + evalResult.overall;
    
    const mIcon = evalResult.morning.status === 'good' ? '🌅' :
                  evalResult.morning.status === 'mid' ? '🌤️' : '⛔';
    const eIcon = evalResult.evening.status === 'good' ? '🌇' :
                  evalResult.evening.status === 'mid' ? '🌤️' : '⛔';
    
    const dayName = i === 0 ? '今天' : weekdays[date.getDay()];
    
    dayDiv.innerHTML = `
      <div class="forecast-day-name">${dayName}</div>
      <div class="forecast-day-date">${date.getMonth() + 1}/${date.getDate()}</div>
      <span class="forecast-day-icon">${info.icon}</span>
      <div class="forecast-day-temp">${tempMax}°</div>
      <div class="forecast-day-sun ${overallClass}" title="晨光: ${evalResult.morning.label} · 傍晚: ${evalResult.evening.label}">
        ${overallIcon} ${overallLabel}
      </div>
      <div class="forecast-day-windows">
        <span class="win-m" title="晨光区间 ${evalResult.morning.elev.toFixed(0)}°">${mIcon}</span>
        <span class="win-e" title="傍晚区间 ${evalResult.evening.elev.toFixed(0)}°">${eIcon}</span>
      </div>
    `;
    
    dayDiv.addEventListener('click', () => {
      renderCompass(doy);
      stopAnimation();
    });
    
    container.appendChild(dayDiv);
  }
}

function updateWeatherForDoy(doy) {
  const weatherData = getWeatherForDoy(doy);
  const sunData = calcSunTimes(doy);
  
  const morningEl = document.getElementById('morningGolden');
  const eveningEl = document.getElementById('eveningGolden');
  
  if (!weatherData) {
    const card = document.getElementById('weatherCard');
    card.className = 'weather-card unavailable';
    document.getElementById('weatherIcon').textContent = '📅';
    document.getElementById('weatherTemp').textContent = '—';
    document.getElementById('weatherDesc').textContent = '预报范围外';
    document.getElementById('weatherDetail').innerHTML = '<span style="color:rgba(255,255,255,0.5);font-size:0.75rem;">天气数据仅覆盖今日起7日，远期日期无实时天气</span>';
    
    if (morningEl.dataset.originalText) {
      morningEl.textContent = morningEl.dataset.originalText;
      delete morningEl.dataset.originalText;
    }
    if (eveningEl.dataset.originalText) {
      eveningEl.textContent = eveningEl.dataset.originalText;
      delete eveningEl.dataset.originalText;
    }
    morningEl.style.color = '';
    eveningEl.style.color = '#ffb74d';
    delete morningEl.dataset.evalMarked;
    delete eveningEl.dataset.evalMarked;
    renderForecast();
    return;
  }
  
  const info = interpretWeather(weatherData.weather_code);
  const evalResult = evaluateSunbathing(sunData, weatherData.weather_code, doy);
  
  if (morningEl.textContent) {
    morningEl.dataset.originalText = morningEl.textContent;
  }
  if (eveningEl.textContent) {
    eveningEl.dataset.originalText = eveningEl.textContent;
  }
  
  morningEl.dataset.evalMarked = '1';
  eveningEl.dataset.evalMarked = '1';
  
  const card = document.getElementById('weatherCard');
  card.className = 'weather-card ' + info.type;
  
  document.getElementById('weatherIcon').textContent = info.icon;
  document.getElementById('weatherTemp').textContent = `${Math.round(weatherData.temp_max)}°`;
  document.getElementById('weatherDesc').textContent = info.desc;
  
  let detailHtml = `最高 ${Math.round(weatherData.temp_max)}° · 最低 ${Math.round(weatherData.temp_min)}°`;
  if (weatherData.precipitation > 0) {
    detailHtml += ` · 降水 ${weatherData.precipitation}mm`;
  }
  
  const overallLabel = evalResult.overall === 'good' ? '适合' :
                       evalResult.overall === 'mid' ? '有限' : '不可';
  const overallIcon = evalResult.overall === 'good' ? '✅' :
                      evalResult.overall === 'mid' ? '☀️' : '⛔';
  detailHtml += `<div class="weather-${evalResult.overall}">${overallIcon} 全日照${overallLabel}</div>`;
  
  detailHtml += '<div class="weather-windows-detail">';
  detailHtml += `<span class="win-detail">🌅 晨光 ${evalResult.morning.label}(${evalResult.morning.elev.toFixed(0)}°)</span>`;
  detailHtml += `<span class="win-detail">🌇 傍晚 ${evalResult.evening.label}(${evalResult.evening.elev.toFixed(0)}°)</span>`;
  detailHtml += '</div>';
  
  document.getElementById('weatherDetail').innerHTML = detailHtml;
  
  const mStatus = evalResult.morning;
  const eStatus = evalResult.evening;
  
  function statusIcon(status) {
    return status === 'good' ? '✅' : status === 'mid' ? '☀️' : '⛔';
  }
  
  morningEl.textContent = `${statusIcon(mStatus.status)} ${mStatus.label}(${mStatus.elev.toFixed(0)}°)`;
  eveningEl.textContent = `${statusIcon(eStatus.status)} ${eStatus.label}(${eStatus.elev.toFixed(0)}°)`;
  
  morningEl.style.color = mStatus.status === 'good' ? '#66bb6a' : mStatus.status === 'mid' ? '#ffb74d' : '#ef5350';
  eveningEl.style.color = eStatus.status === 'good' ? '#66bb6a' : eStatus.status === 'mid' ? '#ffb74d' : '#ef5350';
  
  renderForecast();
}

function setToday() {
  const now = new Date();
  const doy = dayOfYear(now.getMonth() + 1, now.getDate());
  renderCompass(doy);
  stopAnimation();
}

function prevDay() {
  const current = parseInt(document.getElementById('daySlider').value);
  renderCompass(current <= 1 ? 365 : current - 1);
  stopAnimation();
}

function nextDay() {
  const current = parseInt(document.getElementById('daySlider').value);
  renderCompass(current >= 365 ? 1 : current + 1);
  stopAnimation();
}

function stopAnimation() {
  animating = false;
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
}

function playAnimation() {
  if (animating) {
    stopAnimation();
    return;
  }
  animating = true;
  let doy = parseInt(document.getElementById('daySlider').value);
  
  function animate() {
    if (!animating) return;
    doy = doy >= 365 ? 1 : doy + 1;
    renderCompass(doy);
    animationId = setTimeout(animate, 80);
  }
  animate();
}

document.getElementById('daySlider').addEventListener('input', (e) => {
  renderCompass(parseInt(e.target.value));
  stopAnimation();
});

const todayDoy = dayOfYear(new Date().getMonth() + 1, new Date().getDate());
renderCompass(todayDoy);
fetchWeather();
setInterval(fetchWeather, 30 * 60 * 1000);
</script>
